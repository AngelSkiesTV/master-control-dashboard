<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">.
<meta charset="UTF-8">
    <title>Master Control Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <<div id="login-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#2c3e50; z-index:9999; display:flex; justify-content:center; align-items:center; color:white;">
    <div style="text-align:center;">
        <h2>System Access Required</h2>
        
        <input type="password" id="passInput" placeholder="Enter Password" style="padding:10px; border-radius:4px; border:none; display:block; margin: 10px auto;">
        
        <input type="password" id="pinInput" placeholder="Enter 4-digit PIN" style="padding:10px; border-radius:4px; border:none; display:block; margin: 10px auto;">
        
        <button onclick="checkPassword()" style="padding:10px; cursor:pointer;">Login</button>
        
        <p style="margin-top: 15px;">
            <a href="#" onclick="forgotPassword()" style="color: #3498db; text-decoration: underline; cursor: pointer;">Forgot password?</a>
        </p>
    </div>
</div>


    <div class="sidebar">
        <h2>Dashboard</h2>
        <nav>
            <button onclick="showSection('graph')">View Metrics</button>
            <button onclick="showSection('settings')">System Settings</button>
            <button onclick="showSection('integrations')">Integrations</button>
            <button onclick="showSection('viewer')">Project Viewer</button>
        </nav>
    </div>

    <div class="main-content">
        <section id="graph-section">
            <h1>System Metrics</h1>
            <div class="card">
                <canvas id="myChart"></canvas>
            </div>
        </section>

        <section id="settings-section" style="display:none;">
            <h1>System Controls</h1>
            <div class="card">
                <button onclick="toggleFeature()">Enable Security Mode</button>
            </div>
        </section>

        <section id="integrations-section" style="display:none;">
            <h1>External Command Center</h1>
            <div class="card">
                <ul>
                    <li><a href="https://console.aws.amazon.com/" target="_blank">AWS Management Console</a></li>
                    <li><a href="https://console.cloud.google.com/" target="_blank">Google Cloud Platform</a></li>
                </ul>
            </div>
        </section>

        <section id="viewer-section" style="display:none;">
            <h1>Live Project Preview</h1>
            <div class="card">
                <select id="projectSelector" onchange="updateViewer()">
                    <option value="library">Library Node</option>
                    <option value="angels">Angel Skies Node</option>
                    <option value="nexus">Data Nexus</option>
                </select>
                <div class="iframe-container" style="margin-top:20px;">
                    <iframe id="projectFrame" src="about:blank" width="100%" height="500px" style="border:none;"></iframe>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
