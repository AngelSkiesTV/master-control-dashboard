name = "angelskies-api"
main = "worker.js"
compatibility_date = "2026-10-01"

# Fill these IDs after running the setup commands in backend/README.md
[[d1_databases]]
binding = "DB"
database_name = "angelskies-logs"
database_id = "REPLACE_WITH_D1_ID"

[[kv_namespaces]]
binding = "RATE"
id = "REPLACE_WITH_KV_ID"
